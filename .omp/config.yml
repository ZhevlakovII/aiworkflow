# OMP project config (git-shared) — политика ПРОЕКТА, не machine-specific.
# Overrides global per-key (docs/config-usage.md). Schema: docs/approval-mode.md, settings.md.
# Явная регистрация хука (docs/extension-loading.md §4) — не полагаемся на auto-discovery .omp/hooks/pre.
extensions:
  - ./.omp/hooks/pre/zone-guard.ts
  - ./.omp/hooks/queue-runner.ts   # Phase-3: автономная очередь внутри OMP (armed при env OMP_QUEUE)
  - ./.omp/hooks/omp-telemetry.ts  # телеметрия САМОГО omp (запросы/lead/тулы/делегация/ошибки/затраты); off env OMP_TELEMETRY_OFF=1

# Нативные тулы-рельсы (Phase-1 интеграция: логика в OMP, не внешний python).
# gated_commit/push/merge — модель зовёт как first-class тулы; raw git блочит хук/patterns.
customTools:
  - ./.omp/tools/commit.ts
  - ./.omp/tools/push.ts
  - ./.omp/tools/merge.ts
  - ./.omp/tools/design_worker.ts   # Phase-2: design-стадия внутри OMP (claude -p через pi.exec)
  - ./.omp/tools/execute_worker.ts   # P9 Track C: execute-стадия детерминир. (домен-агент→zone+test→FR-trace→commit)
  - ./.omp/tools/archive_spec.ts     # P9 B.2b: delta→archive живая спека (merge SP/FR в канон, reconcile/dedupe)
  - ./.omp/tools/codex_worker.ts     # dsh-seam: execute через codex (кросс-вендор harness-subprocess воркер)
  - ./.omp/tools/plan.ts             # P9 Track D: one-shot план из спеки (claude -p, вне автоконтура)
  - ./.omp/tools/synthesize.ts       # P9 Track D: one-shot синтез N спек (claude -p, вне автоконтура)
  - ./.omp/tools/code_search.ts      # P9 Track A: discovery-мультитул поверх ast-index (дефолт вместо mass-grep)
  - ./.omp/tools/outline.ts          # P9 Track A: структура файла до чтения
  - ./.omp/tools/callers.ts          # P9 Track A: кто зовёт символ (impact-анализ)

# Интерактив: approvalMode=write (промпт на exec = страховка).
# Автономия (P4): scheduler запускает с `--approval-mode yolo` — промптов нет, но рельсы держат
#   (hook-блоки и bash.patterns deny срабатывают независимо от approvalMode). yolo безопасен ТОЛЬКО
#   вместе с хардингом ниже (иначе yolo открывает сеть/exec). Полный автономный хардинг (сетевые тулы off,
#   curl/install deny) — в autonomous-профиле scheduler'а (P4), здесь — always-safe денаи.
tools:
  approvalMode: write
  intentTracing: true        # per-call intent — auditability (INV-7)
  approval:
    eval: deny               # eval обходит bash.patterns И `prompt` в yolo заблокил бы автономию → deny
edit:
  blockAutoGenerated: true
bash:
  patterns:                  # first-match; deny абсолютен даже в yolo
    - match: "rm -rf*"
      approval: deny
    - match: "git push*"
      approval: deny
    - match: "git merge*"
      approval: deny
    # Raw git-МУТАЦИЯ через bash — deny (форсит нативные рельсы gated_commit/push/merge).
    # ПОЧЕМУ: headless `-p` → zone-guard хук UI-gated OFF → без этого модель обходила gated_commit
    #   сырым `git commit` (zone-check не запускался) → полигон-инцидент 2026-08-29 (.omp затрекан).
    #   Рельсы (commit.ts/…) зовут git через pi.exec (НЕ bash-тул) → эти deny их НЕ трогают.
    - match: "git commit*"
      approval: deny
    - match: "git add*"
      approval: deny
    - match: "git reset*"     # reset/checkout/restore могут откатить .gitignore → рас-игнор .omp
      approval: deny
    - match: "git checkout*"
      approval: deny
    - match: "git restore*"
      approval: deny
    - match: "git clean*"
      approval: deny
    - match: "git stash*"
      approval: deny
    - match: "git rm*"
      approval: deny
    - match: "*|sh"          # pipe-to-shell (download→exec) — never legit here
      approval: deny
    - match: "*| sh"
      approval: deny
    - match: "*|bash"
      approval: deny
    - match: "*| bash"
      approval: deny
    - match: "nc *"          # netcat exfil/reverse-shell
      approval: deny
    - match: "ssh *"
      approval: deny
task:
  isolation:
    mode: projfs             # Windows worktree-изоляция fan-out воркеров
