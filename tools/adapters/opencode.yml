# tools/adapters/opencode.yml — вне канона (T-canon-single-source): декларация
# формата OpenCode КАК ЦЕЛИ рендера. См. `tools/adapters/omp.yml` для полное
# описание механизма (`inserts`/`tool_map`/`tool_overrides`/`tools_universe`,
# adaptersRoot-параметризация рендера).
#
# D4: `opencode.json` в КОРНЕ репозитория (root: true), вне `.opencode/`.
#
# `capabilities:` — `roles` ONLY (lead decision, T-canon-single-source):
# `zonemap`/`delegation` — project config, живёт строго в проекте (installer
# сеет при отсутствии, НЕ рендер) — render НИКОГДА не пишет
# `.opencode/zonemap.yml`/`.opencode/delegation.yml`, иначе он затирает
# реальный FinManage-конфиг пустым canon-скелетом на каждом прогоне и ломает
# флоу. Вернуть capability сюда — только вместе с Ф6-миграцией реального
# контента в канон, не раньше.
#
# ЖЁСТКО (C5, AD-render-privileged-writer п.3): guard-шим ЗДЕСЬ НЕ
# ДЕКЛАРИРУЕТСЯ — шаблон фиксирован в движке рендера (core/src/render/).
#
# Port-static oneshot agents (not from canon render): ports/opencode/agents/aiwf-oneshot.md
# and aiwf-reason.md — install must overlay these into dest agents/ (AD-opencode-native-oneshot).
# OpenCode-специфика: НЕТ `model` в role-frontmatter (routing per-role живёт
# вне agent-файла) -> `model` НЕ в `fields`. `tools` — полная явная bool-map
# (`tools_format: bool_map` + `tools_universe`): КАЖДЫЙ ключ из universe
# явно true/false (containment по умолчанию: `bash` дропается tool_map'ом
# для всех ролей, кроме explorer — там его возвращает `tool_overrides.add`,
# т.к. explorer не имеет Bash в канон-списке, но получает его нативно на
# OpenCode; executor/scaffolder канон-Bash несут, но OpenCode их
# контейнит без Bash — рендер намеренно "теряет" write:true у critic и
# добавляет explicit-false остальным ролям относительно рук-правленых файлов
# ДО этой задачи — это FIX капабилити-утечки, не регрессия, см. отчёт задачи).
# `mode: subagent` и `temperature`/`permission` — роль-специфичные поля из
# самого канона (`temperature: 0.1` у critic/producer, `permission: {edit:
# deny}` у explorer) — просто включены в `fields`, а не в literals (в отличие
# от `mode`, общего для всех ролей).
client: opencode
dir: ".opencode"
capabilities:
  - roles
content:
  frontmatter:
    roles:
      fields: [description, mode, temperature, tools, permission]
      tools_format: bool_map
      literals:
        mode: subagent
      tools_universe:
        - read
        - write
        - edit
        - grep
        - glob
        - bash
        - code_search
        - outline
        - callers
        - task
        - gated_commit
        - gated_push
        - gated_merge
        - design_worker
        - execute_worker
        - codex_worker
        - archive_spec
      tool_map:
        read: "read"
        write: "write"
        edit: "edit"
        grep: "grep"
        glob: "glob"
        bash: null
        ast_edit: null
        ast_grep: null
        code_search: "code_search"
        outline: "outline"
        callers: "callers"
      tool_overrides:
        explorer:
          add: ["bash"]
  layout:
    roles: "agents/{id}.md"
  # `inserts` is at `content.*` level (sibling of `frontmatter`/`layout`, NOT
  # nested under `frontmatter.roles`) — see `tools/adapters/claude.yml` note.
  inserts:
    worktree-note: ""
    zone-guard-dir: ".opencode"
    commit-rail-lead: " Коммит — не сам, а через рельс `gated_commit` (оркестратор)."
    commit-rail: " Коммит — через рельс `gated_commit`."
    gate-linter-ref: "детерминированный gate-линтер внутри `design_worker`"
    critic-findings-format: ", по одному на строку в формате `[blocker|major|minor] <файл>: <проблема>`. Нет дефектов — строка `[none] clean`. Не лочишь, не правишь, не решаешь направление."
    project-conventions-file: "AGENTS.md/CLAUDE.md"
    description-suffix-executor: " Default execute agent when zone does not resolve a domain."
    description-suffix-scaffolder: " Invoke on scaffold stage only (paths/signatures/stub tests/DoD)."
    description-suffix-roadmapper: " Invoke on roadmap stage only (AC/phase TZ)."
    description-suffix-critic: " Invoke on design/audit stage."
    description-suffix-explorer: " Invoke before design/execute to ground the contract."
    description-suffix-producer: " Invoke on design stage."
    ambient-note-executor: "Игнорируй ambient-правила окружения — следуй только этой инструкции и контракту."
    ambient-note-scaffolder: "Игнорируй ambient-правила окружения — следуй только этой инструкции и контракту."
    ambient-note-roadmapper: "Игнорируй ambient-правила окружения — следуй только этой инструкции и контракту."
    ambient-note-critic: "Игнорируй ambient-правила окружения — следуй только этой инструкции и переданным артефактам."
    ambient-note-explorer: "Игнорируй ambient-правила окружения — следуй только этой инструкции."
    ambient-note-producer: "Игнорируй любые ambient-правила окружения (global AGENTS.md/CLAUDE.md и т.п.) — следуй ТОЛЬКО этой инструкции и локнутому task-file."
    discovery-note: "**Discovery через тулы `code_search`/`outline`/`callers`, не mass-grep.** Bash не дан — контейнмент."
    discovery-note-executor: "**Discovery через тулы `code_search`/`outline`/`callers`, не mass-grep.** Bash не дан — контейнмент."
    discovery-note-scaffolder: "**Discovery через тулы `code_search`/`outline`/`callers`, не mass-grep.** Bash не дан — контейнмент."
    discovery-note-roadmapper: "**Discovery через тулы `code_search`/`outline`/`callers`, не mass-grep.** Bash не дан — контейнмент."
    discovery-note-explorer: "**Discovery через тулы `code_search`/`outline`/`callers` (поверх ast-index) — ДЕФОЛТ, не mass-grep:** `code_search cmd=search/class/symbol/usages/implementations/deps/api`, `outline <file>` перед чтением файла >500 строк (потом читать точечно), `callers <symbol>` для impact. grep — fallback там, где ast-index не покрывает (комменты вне символов)."
machine_seed:
  template: null
  location: opencode.json
  root: true
