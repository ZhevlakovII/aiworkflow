# canon/zonemap.yml — example only (NOT seeded to consumers)
#
# Live parser shape (`core/src/zone/zonemap.ts` parseZoneMap / resolveAgent):
#   default:
#     agent: <name>          # missing/null agent → executor
#   deny-domain:             # kebab-case key; list of {glob}
#     - glob: "legacy/**"
#   map:                     # entries need glob + tech + agent (else dropped)
#     - glob: "path/glob/**"
#       tech: stack-id
#       agent: consumer-agent-name
#
# Installers do NOT seed this file into projects. Absence is normal and
# resolves to executor on the execute path. Create a filled map only for
# explicit consumer opt-in routing (overlay agent file + map entry together).
# Single-stack projects need not author a map.
#
# Scalar `default: null` / empty map / missing file → executor.
# Diagnostic zonemap CLI may still exit non-zero when a path is forced;
# execute resolve stays soft (executor + signals, no stage fail).

map: []
default:
  agent: executor
deny-domain: []
